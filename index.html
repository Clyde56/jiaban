<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人月度加班记录器 - 优化版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .container {
            background-color: white;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(50, 50, 93, 0.1), 0 5px 15px rgba(0, 0, 0, 0.07);
            width: 100%;
            max-width: 1200px;
            padding: 25px;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 15px;
        }
        header h1 {
            color: #2d3436;
            margin-bottom: 8px;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
        }
        header .subtitle {
            color: #636e72;
            font-size: clamp(0.8rem, 2vw, 0.95rem);
        }

        .control-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .control-panel h2 {
            color: #0984e3;
            flex-grow: 1;
            text-align: center;
            font-size: clamp(1.1rem, 2.8vw, 1.6rem);
            margin: 5px 0;
        }
        
        /* 按钮样式优化 - 移动端更小 */
        .control-panel button {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background-color: #0984e3;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: clamp(0.75rem, 1.8vw, 0.9rem);
            white-space: nowrap;
            min-height: 38px;
        }
        
        @media (max-width: 768px) {
            .control-panel {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                gap: 8px;
            }
            
            .control-panel h2 {
                order: 2;
                flex-grow: 0;
                margin: 0 10px;
                font-size: 1.2rem;
            }
            
            #prev-month {
                order: 1;
            }
            
            #next-month {
                order: 3;
            }
            
            #reset-month {
                order: 4;
                margin-left: auto;
                padding: 6px 10px;
                font-size: 0.8rem;
                min-height: 32px;
            }
            
            .control-panel button {
                padding: 6px 10px;
                min-height: 32px;
                font-size: 0.8rem;
            }
        }
        
        @media (max-width: 480px) {
            .control-panel h2 {
                font-size: 1rem;
                margin: 0 5px;
            }
            
            .control-panel button {
                padding: 5px 8px;
                min-height: 30px;
                font-size: 0.75rem;
            }
            
            #reset-month {
                padding: 5px 8px;
                font-size: 0.7rem;
            }
        }
        
        .control-panel button:hover {
            background-color: #0770c4;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .control-panel .reset-btn {
            background-color: #e17055;
        }
        .control-panel .reset-btn:hover {
            background-color: #d63031;
        }

        /* 日历网格优化 */
        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-bottom: 25px;
        }
        
        @media (max-width: 768px) {
            .calendar {
                gap: 4px;
            }
        }
        
        .weekday {
            text-align: center;
            font-weight: 600;
            color: #636e72;
            padding: 12px 5px;
            background-color: #f8f9fa;
            border-radius: 8px;
            font-size: clamp(0.75rem, 2vw, 0.95rem);
        }
        
        @media (max-width: 480px) {
            .weekday {
                padding: 8px 3px;
                font-size: 0.75rem;
            }
        }
        
        /* 日期框样式优化 */
        .day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
            position: relative;
            user-select: none;
            min-height: 50px;
            border: 2px solid transparent;
        }
        
        @media (max-width: 768px) {
            .day {
                min-height: 40px;
                border-radius: 8px;
            }
        }
        
        @media (max-width: 480px) {
            .day {
                min-height: 35px;
                border-radius: 6px;
            }
        }
        
        .day:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-color: rgba(0, 0, 0, 0.1);
        }
        
        .day .date-num {
            font-size: clamp(0.9rem, 2.5vw, 1.3rem);
            margin-bottom: 3px;
        }
        
        @media (max-width: 480px) {
            .day .date-num {
                font-size: 0.9rem;
                margin-bottom: 1px;
            }
        }
        
        .day .status-text {
            font-size: clamp(0.6rem, 1.8vw, 0.7rem);
            opacity: 0.9;
        }
        
        @media (max-width: 480px) {
            .day .status-text {
                font-size: 0.55rem;
            }
        }

        /* 日期状态样式 */
        .day.normal {
            background-color: #dfe6e9;
            color: #636e72;
        }
        .day.half {
            background-color: #ffeaa7;
            color: #e17055;
        }
        .day.full {
            background-color: #fab1a0;
            color: #d63031;
        }
        .day.other-month {
            background-color: #f8f9fa;
            color: #b2bec3;
            cursor: default;
            opacity: 0.6;
        }
        .day.other-month:hover {
            transform: none;
            box-shadow: none;
            border-color: transparent;
        }
        
        /* 点击动画效果 */
        .day.click-animation {
            animation: clickEffect 0.3s ease-out;
        }
        
        @keyframes clickEffect {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 rgba(0, 0, 0, 0);
            }
            50% {
                transform: scale(0.95);
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 rgba(0, 0, 0, 0);
            }
        }
        
        /* 状态变化动画 */
        .day.status-change {
            animation: statusChange 0.5s ease-out;
        }
        
        @keyframes statusChange {
            0% {
                transform: scale(1);
            }
            25% {
                transform: scale(0.9);
            }
            50% {
                transform: scale(1.05);
            }
            75% {
                transform: scale(0.95);
            }
            100% {
                transform: scale(1);
            }
        }

        /* 气泡特效样式 */
        .bubble {
            position: absolute;
            pointer-events: none;
            z-index: 100;
            font-weight: bold;
            font-size: 1.2rem;
            animation: bubbleFloat 1s ease-out forwards;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        
        @keyframes bubbleFloat {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-60px) scale(1.5);
                opacity: 0;
            }
        }

        .stats-panel {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 25px;
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        
        @media (max-width: 768px) {
            .stats-panel {
                padding: 15px;
                gap: 20px;
            }
        }
        
        .stat-box, .legend {
            flex: 1;
            min-width: 240px;
        }
        
        @media (max-width: 768px) {
            .stat-box, .legend {
                min-width: 100%;
            }
        }
        
        .stat-box h3, .legend h3 {
            color: #2d3436;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #ddd;
            font-size: 1.1rem;
        }
        
        .stat-box p {
            margin-bottom: 6px;
            color: #636e72;
            font-size: 0.95rem;
        }
        
        .stat-box p span {
            font-weight: 600;
            color: #0984e3;
        }
        
        .hint {
            font-size: 0.8rem;
            color: #b2bec3 !important;
            font-style: italic;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }
        
        .day-box {
            width: 22px;
            height: 22px;
            border-radius: 5px;
            margin-right: 10px;
            border: 2px solid rgba(255,255,255,0.7);
        }
        
        .day-box.normal { background-color: #dfe6e9; }
        .day-box.half { background-color: #ffeaa7; }
        .day-box.full { background-color: #fab1a0; }

        footer {
            text-align: center;
            color: #636e72;
            font-size: clamp(0.75rem, 1.8vw, 0.85rem);
            border-top: 1px solid #eaeaea;
            padding-top: 18px;
        }
        
        .export-options {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }
        
        footer button {
            margin: 5px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background-color: #00b894;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: clamp(0.75rem, 1.8vw, 0.9rem);
            min-height: 38px;
        }
        
        @media (max-width: 768px) {
            footer button {
                padding: 8px 16px;
                min-height: 36px;
                font-size: 0.8rem;
            }
        }
        
        @media (max-width: 480px) {
            footer button {
                padding: 7px 14px;
                min-height: 34px;
                font-size: 0.75rem;
            }
        }
        
        footer button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        #export-json { 
            background-color: #00b894; 
        }
        
        #export-json:hover { 
            background-color: #00a085; 
        }
        
        #export-md { 
            background-color: #6c5ce7; 
        }
        
        #export-md:hover { 
            background-color: #5b4fcf; 
        }
        
        #import-data { 
            background-color: #fd79a8; 
        }
        
        #import-data:hover { 
            background-color: #e84393; 
        }

        /* 设置按钮样式 */
        .settings-btn {
            background-color: #636e72 !important;
        }
        .settings-btn:hover {
            background-color: #2d3436 !important;
        }

        /* 同步状态样式 */
        .sync-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background-color: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 0.85rem;
            color: #636e72;
        }
        
        .sync-status.connected {
            border-left: 3px solid #00b894;
        }
        
        .sync-status.disconnected {
            border-left: 3px solid #e17055;
        }
        
        .sync-status .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #e17055;
        }
        
        .sync-status.connected .status-dot {
            background-color: #00b894;
        }
        
        .sync-btn {
            background-color: #0984e3 !important;
        }
        
        .sync-btn:hover {
            background-color: #0770c4 !important;
        }
        
        .sync-btn:disabled {
            background-color: #b2bec3 !important;
            cursor: not-allowed;
            transform: none !important;
        }

        /* 模态框样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            animation: modalAppear 0.3s ease-out;
        }
        
        .settings-modal .modal-content {
            max-width: 500px;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #2d3436;
            font-size: 0.9rem;
        }
        
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #0984e3;
        }
        
        .form-group .hint {
            margin-top: 4px;
            font-size: 0.8rem;
            color: #b2bec3;
            font-style: italic;
        }
        
        @keyframes modalAppear {
            0% {
                opacity: 0;
                transform: translateY(-20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .modal h3 {
            margin-bottom: 12px;
            color: #2d3436;
            font-size: 1.2rem;
        }
        
        .modal p {
            margin-bottom: 20px;
            color: #636e72;
            font-size: 0.95rem;
        }
        
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        
        .modal button {
            padding: 8px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        
        #modal-confirm {
            background-color: #e74c3c;
            color: white;
        }
        
        #modal-confirm:hover {
            background-color: #c0392b;
        }
        
        #modal-cancel {
            background-color: #bdc3c7;
            color: #2d3436;
        }
        
        #modal-cancel:hover {
            background-color: #95a5a6;
        }

        /* 移动端优化 */
        @media (max-width: 768px) {
            .container {
                padding: 18px;
                border-radius: 15px;
            }
            
            .control-panel {
                flex-direction: row;
                align-items: center;
                gap: 8px;
            }
            
            .control-panel h2 {
                order: 2;
                margin-bottom: 0;
            }
            
            #prev-month {
                order: 1;
            }
            
            #next-month {
                order: 3;
            }
            
            #reset-month {
                order: 4;
                margin-left: auto;
            }
            
            .stats-panel {
                flex-direction: column;
                gap: 18px;
                padding: 15px;
            }
            
            footer {
                padding-top: 15px;
            }
            
            .export-options {
                flex-direction: column;
                align-items: center;
            }
            
            footer button {
                width: 100%;
                justify-content: center;
            }
            
            .modal-content {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 12px;
                border-radius: 12px;
            }
            
            .day .status-text {
                display: none;
            }
            
            .day {
                min-height: 32px;
            }
            
            .weekday {
                padding: 6px 2px;
            }
            
            header {
                margin-bottom: 15px;
                padding-bottom: 12px;
            }
            
            .control-panel {
                margin-bottom: 15px;
            }
            
            .control-panel h2 {
                font-size: 1rem;
                margin: 0 5px;
            }
            
            .control-panel button {
                padding: 5px 8px;
                min-height: 30px;
                font-size: 0.75rem;
            }
            
            #reset-month {
                padding: 5px 8px;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-clock"></i> 我的加班日历</h1>
            <p class="subtitle">点击日期切换状态：未加班 → 半天 → 全天</p>
        </header>

        <main>
            <div class="control-panel">
                <button id="prev-month"><i class="fas fa-chevron-left"></i> 上月</button>
                <h2 id="current-month">2026年1月</h2>
                <button id="next-month">下月 <i class="fas fa-chevron-right"></i></button>
                <button id="reset-month" class="reset-btn"><i class="fas fa-redo"></i> 重置本月</button>
            </div>

            <div class="calendar" id="calendar">
                <!-- 日历网格将由JavaScript动态生成 -->
            </div>

            <div class="stats-panel">
                <div class="stat-box">
                    <h3><i class="fas fa-calendar-day"></i> 本月统计</h3>
                    <p>全天加班: <span id="count-full">0</span> 天</p>
                    <p>半天加班: <span id="count-half">0</span> 天</p>
                    <p>总计加班: <span id="count-total">0</span> 天</p>
                    <p class="hint">(1全天 = 2半天)</p>
                </div>
                <div class="legend">
                    <h3><i class="fas fa-key"></i> 图例</h3>
                    <div class="legend-item"><span class="day-box normal"></span> 未加班/休息</div>
                    <div class="legend-item"><span class="day-box half"></span> 加半天班</div>
                    <div class="legend-item"><span class="day-box full"></span> 加全天班</div>
                </div>
            </div>
        </main>

        <footer>
            <div class="sync-status" id="sync-status">
                <span class="status-dot"></span>
                <span id="sync-status-text">未配置GitHub同步</span>
            </div>
            <p>数据保存在你的浏览器本地，清空浏览器缓存会丢失记录。</p>
            <div class="export-options">
                <button id="export-json"><i class="fas fa-file-code"></i> 导出JSON</button>
                <button id="export-md"><i class="fas fa-file-alt"></i> 导出Markdown</button>
            </div>
            <div class="export-options">
                <button id="sync-pull" class="sync-btn" disabled><i class="fas fa-cloud-download-alt"></i> 从GitHub拉取</button>
                <button id="sync-push" class="sync-btn" disabled><i class="fas fa-cloud-upload-alt"></i> 推送到GitHub</button>
                <button id="settings-btn" class="settings-btn"><i class="fas fa-cog"></i> 设置</button>
            </div>
            <button id="import-data"><i class="fas fa-upload"></i> 导入数据</button>
            <input type="file" id="file-input" accept=".json,.md" style="display: none;">
        </footer>
    </div>

    <!-- 确认重置模态框 -->
    <div class="modal" id="reset-modal">
        <div class="modal-content">
            <h3>确认重置</h3>
            <p id="reset-modal-text">确定要清空当前月份的所有加班记录吗？</p>
            <div class="modal-buttons">
                <button id="modal-cancel">取消</button>
                <button id="modal-confirm">确认重置</button>
            </div>
        </div>
    </div>

    <!-- GitHub设置模态框 -->
    <div class="modal settings-modal" id="settings-modal">
        <div class="modal-content">
            <h3><i class="fab fa-github"></i> GitHub同步设置</h3>
            <div class="form-group">
                <label for="github-token">Personal Access Token</label>
                <input type="password" id="github-token" placeholder="ghp_xxxxxxxxxxxx">
                <p class="hint">在 GitHub Settings > Developer settings > Personal access tokens 创建</p>
            </div>
            <div class="form-group">
                <label for="github-repo">仓库地址</label>
                <input type="text" id="github-repo" placeholder="username/repo-name">
                <p class="hint">例如: myname/overtime-data</p>
            </div>
            <div class="form-group">
                <label for="github-path">文件路径</label>
                <input type="text" id="github-path" placeholder="overtime-data.json" value="overtime-data.json">
                <p class="hint">仓库中存储数据的文件名</p>
            </div>
            <div class="modal-buttons">
                <button id="settings-cancel">取消</button>
                <button id="settings-save">保存设置</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const calendarEl = document.getElementById('calendar');
            const currentMonthEl = document.getElementById('current-month');
            const prevMonthBtn = document.getElementById('prev-month');
            const nextMonthBtn = document.getElementById('next-month');
            const resetMonthBtn = document.getElementById('reset-month');
            const exportJsonBtn = document.getElementById('export-json');
            const exportMdBtn = document.getElementById('export-md');
            const importBtn = document.getElementById('import-data');
            const fileInput = document.getElementById('file-input');
            const resetModal = document.getElementById('reset-modal');
            const modalCancel = document.getElementById('modal-cancel');
            const modalConfirm = document.getElementById('modal-confirm');
            const resetModalText = document.getElementById('reset-modal-text');
            
            // GitHub同步相关元素
            const settingsBtn = document.getElementById('settings-btn');
            const settingsModal = document.getElementById('settings-modal');
            const settingsCancel = document.getElementById('settings-cancel');
            const settingsSave = document.getElementById('settings-save');
            const githubTokenInput = document.getElementById('github-token');
            const githubRepoInput = document.getElementById('github-repo');
            const githubPathInput = document.getElementById('github-path');
            const syncPullBtn = document.getElementById('sync-pull');
            const syncPushBtn = document.getElementById('sync-push');
            const syncStatus = document.getElementById('sync-status');
            const syncStatusText = document.getElementById('sync-status-text');

            // 状态变量

            // --- 核心函数 ---

            // 1. 渲染日历
            function renderCalendar() {
                calendarEl.innerHTML = '';
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth(); // 0-11

                // 更新标题
                currentMonthEl.textContent = `${year}年${month + 1}月`;

                // 添加上一周的星期标签
                const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
                weekdays.forEach(day => {
                    const div = document.createElement('div');
                    div.className = 'weekday';
                    div.textContent = day;
                    calendarEl.appendChild(div);
                });

                // 计算本月第一天是星期几（0-6，0是周日）
                const firstDayOfMonth = new Date(year, month, 1).getDay();
                // 计算本月有多少天
                const daysInMonth = new Date(year, month + 1, 0).getDate();

                // 添加上个月末尾的几天（灰色显示）
                const prevMonthLastDay = new Date(year, month, 0).getDate();
                for (let i = 0; i < firstDayOfMonth; i++) {
                    const day = document.createElement('div');
                    day.className = 'day other-month';
                    day.textContent = prevMonthLastDay - firstDayOfMonth + i + 1;
                    calendarEl.appendChild(day);
                }

                // 添加本月的所有天
                const monthKey = `${year}-${month + 1}`;
                const currentMonthData = overtimeData[monthKey] || {};

                for (let i = 1; i <= daysInMonth; i++) {
                    const day = document.createElement('div');
                    day.className = 'day';
                    day.dataset.date = i; // 存储日期数字

                    const dateNumSpan = document.createElement('span');
                    dateNumSpan.className = 'date-num';
                    dateNumSpan.textContent = i;
                    day.appendChild(dateNumSpan);

                    const statusSpan = document.createElement('span');
                    statusSpan.className = 'status-text';
                    day.appendChild(statusSpan);

                    // 设置初始状态
                    const status = currentMonthData[i] || 'normal';
                    updateDayStatus(day, status);

                    // 点击事件：循环切换状态并添加动画
                    day.addEventListener('click', (e) => {
                        if (day.classList.contains('other-month')) return;
                        
                        // 添加点击动画
                        day.classList.add('click-animation');
                        setTimeout(() => {
                            day.classList.remove('click-animation');
                        }, 300);
                        
                        const currentStatus = day.dataset.status;
                        let nextStatus;
                        switch(currentStatus) {
                            case 'normal': nextStatus = 'half'; break;
                            case 'half': nextStatus = 'full'; break;
                            default: nextStatus = 'normal'; break;
                        }
                        
                        // 添加状态变化动画
                        day.classList.add('status-change');
                        setTimeout(() => {
                            day.classList.remove('status-change');
                        }, 500);
                        
                        updateDayStatus(day, nextStatus);
                        saveDayStatus(i, nextStatus);
                        updateStats();
                        
                        // 添加气泡特效
                        createBubbleEffect(e, day);
                    });

                    calendarEl.appendChild(day);
                }

                // 添加下个月开头的几天（灰色显示）
                const totalCells = 42; // 6行 * 7列，保证日历网格固定
                const cellsSoFar = firstDayOfMonth + daysInMonth;
                for (let i = 1; i <= (totalCells - cellsSoFar); i++) {
                    const day = document.createElement('div');
                    day.className = 'day other-month';
                    day.textContent = i;
                    calendarEl.appendChild(day);
                }

                updateStats(); // 渲染完成后更新统计
            }

            // 2. 更新单个日期的视觉状态
            function updateDayStatus(dayElement, status) {
                // 移除所有状态类
                dayElement.classList.remove('normal', 'half', 'full');
                // 添加新状态类
                dayElement.classList.add(status);
                // 更新data-status属性
                dayElement.dataset.status = status;
                // 更新状态文本
                const statusMap = { 'normal': '未加班', 'half': '半天', 'full': '全天' };
                dayElement.querySelector('.status-text').textContent = statusMap[status];
            }

            // 3. 将某天的状态保存到 overtimeData 对象和 localStorage
            function saveDayStatus(day, status) {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth() + 1;
                const key = `${year}-${month}`;

                if (!overtimeData[key]) {
                    overtimeData[key] = {};
                }

                if (status === 'normal') {
                    // 如果是"未加班"，则从数据中删除这一项，以节省空间
                    delete overtimeData[key][day];
                    // 如果这个月的数据空了，也删除这个月的键
                    if (Object.keys(overtimeData[key]).length === 0) {
                        delete overtimeData[key];
                    }
                } else {
                    overtimeData[key][day] = status;
                }

                // 保存到 localStorage
                localStorage.setItem('overtimeRecord', JSON.stringify(overtimeData));
            }

            // 4. 从 localStorage 加载数据
            function loadData() {
                const saved = localStorage.getItem('overtimeRecord');
                if (saved) {
                    try {
                        overtimeData = JSON.parse(saved);
                    } catch (e) {
                        console.error('解析保存的数据时出错:', e);
                        overtimeData = {};
                    }
                }
            }

            // 5. 更新统计面板
            function updateStats() {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth() + 1;
                const key = `${year}-${month}`;
                const monthData = overtimeData[key] || {};

                let fullDays = 0;
                let halfDays = 0;

                for (const day in monthData) {
                    if (monthData[day] === 'full') fullDays++;
                    if (monthData[day] === 'half') halfDays++;
                }

                const totalDays = fullDays + (halfDays / 2); // 将半天折算为0.5个全天

                document.getElementById('count-full').textContent = fullDays;
                document.getElementById('count-half').textContent = halfDays;
                document.getElementById('count-total').textContent = totalDays.toFixed(1);
            }

            // 10. 导出数据（修复编码问题）
            function exportData(format) {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth() + 1;
                const key = `${year}-${month}`;
                const monthData = overtimeData[key] || {};
                
                let dataStr, mimeType, fileName;
                
                if (format === 'json') {
                    const dataToExport = {
                        month: key,
                        data: monthData,
                        generatedAt: new Date().toISOString(),
                        version: '1.0'
                    };
                    dataStr = JSON.stringify(dataToExport, null, 2);
                    mimeType = 'application/json';
                    fileName = `加班记录_${key}.json`;
                } else if (format === 'md') {
                    // 生成Markdown格式
                    dataStr = generateMarkdown(year, month, monthData);
                    mimeType = 'text/markdown;charset=utf-8';
                    fileName = `加班记录_${key}.md`;
                }
                
                // 使用Blob和URL.createObjectURL解决编码问题
                const blob = new Blob([dataStr], { type: mimeType });
                const url = URL.createObjectURL(blob);
                
                const linkElement = document.createElement('a');
                linkElement.href = url;
                linkElement.download = fileName;
                linkElement.style.display = 'none';
                document.body.appendChild(linkElement);
                linkElement.click();
                
                // 清理
                setTimeout(() => {
                    document.body.removeChild(linkElement);
                    URL.revokeObjectURL(url);
                }, 100);
                
                // 显示导出成功提示
                showExportSuccess(format);
            }

            // 11. 生成Markdown格式内容
            function generateMarkdown(year, month, monthData) {
                const monthNames = ['一月', '二月', '三月', '四月', '五月', '六月', 
                                   '七月', '八月', '九月', '十月', '十一月', '十二月'];
                const monthName = monthNames[month - 1];
                
                let markdown = `# ${year}年${monthName}加班记录\n\n`;
                markdown += `> 生成时间: ${new Date().toLocaleString('zh-CN')}\n\n`;
                
                // 统计信息
                let fullDays = 0, halfDays = 0;
                for (const day in monthData) {
                    if (monthData[day] === 'full') fullDays++;
                    if (monthData[day] === 'half') halfDays++;
                }
                const totalDays = fullDays + (halfDays / 2);
                
                markdown += `## 统计信息\n\n`;
                markdown += `- **全天加班**: ${fullDays} 天\n`;
                markdown += `- **半天加班**: ${halfDays} 天\n`;
                markdown += `- **总计加班**: ${totalDays.toFixed(1)} 天 (1全天 = 2半天)\n\n`;
                
                // 加班详情表格
                markdown += `## 加班详情\n\n`;
                markdown += `| 日期 | 星期 | 加班状态 |\n`;
                markdown += `|------|------|----------|\n`;
                
                // 获取该月第一天和最后一天
                const firstDay = new Date(year, month - 1, 1);
                const lastDay = new Date(year, month, 0);
                const daysInMonth = lastDay.getDate();
                const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
                
                for (let day = 1; day <= daysInMonth; day++) {
                    const date = new Date(year, month - 1, day);
                    const weekday = weekdays[date.getDay()];
                    const status = monthData[day] || '未加班';
                    const statusText = status === 'full' ? '全天' : 
                                     status === 'half' ? '半天' : '未加班';
                    
                    markdown += `| ${month}月${day}日 | 星期${weekday} | ${statusText} |\n`;
                }
                
                return markdown;
            }

            // 12. 从文件导入数据
            function importData(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const fileContent = e.target.result;
                        let importedData;
                        
                        // 根据文件扩展名判断格式
                        if (file.name.endsWith('.json')) {
                            importedData = JSON.parse(fileContent);
                            if (importedData.month && importedData.data) {
                                overtimeData[importedData.month] = importedData.data;
                                localStorage.setItem('overtimeRecord', JSON.stringify(overtimeData));
                                
                                // 如果导入的正是当前查看的月份，则刷新日历
                                const currentKey = `${currentDate.getFullYear()}-${currentDate.getMonth() + 1}`;
                                if (importedData.month === currentKey) {
                                    renderCalendar();
                                }
                                showImportSuccess(importedData.month);
                            } else {
                                alert('JSON文件格式不正确，无法导入。');
                            }
                        } else if (file.name.endsWith('.md')) {
                            // 解析Markdown文件
                            importedData = parseMarkdown(fileContent);
                            if (importedData) {
                                overtimeData[importedData.month] = importedData.data;
                                localStorage.setItem('overtimeRecord', JSON.stringify(overtimeData));
                                
                                // 如果导入的正是当前查看的月份，则刷新日历
                                const currentKey = `${currentDate.getFullYear()}-${currentDate.getMonth() + 1}`;
                                if (importedData.month === currentKey) {
                                    renderCalendar();
                                }
                                showImportSuccess(importedData.month);
                            } else {
                                alert('Markdown文件格式不正确，无法导入。');
                            }
                        } else {
                            alert('不支持的文件格式，请选择JSON或Markdown文件。');
                        }
                    } catch (error) {
                        alert('读取文件失败，请确保选择的是有效的文件。');
                        console.error(error);
                    }
                    // 清空文件输入，以便再次选择同一个文件
                    fileInput.value = '';
                };
                reader.readAsText(file, 'UTF-8'); // 明确指定UTF-8编码
            }

            // 13. 解析Markdown文件
            function parseMarkdown(content) {
                try {
                    const lines = content.split('\n');
                    let monthKey = null;
                    const data = {};
                    
                    // 查找月份信息
                    const monthMatch = content.match(/# (\d{4})年(\d{1,2})月加班记录/);
                    if (monthMatch) {
                        const year = parseInt(monthMatch[1]);
                        const month = parseInt(monthMatch[2]);
                        monthKey = `${year}-${month}`;
                    }
                    
                    if (!monthKey) return null;
                    
                    // 查找表格部分
                    let inTable = false;
                    for (const line of lines) {
                        if (line.startsWith('| 日期 |')) {
                            inTable = true;
                            continue;
                        }
                        
                        if (inTable && line.startsWith('|')) {
                            // 解析表格行
                            const cells = line.split('|').map(cell => cell.trim()).filter(cell => cell);
                            if (cells.length === 3) {
                                // 解析日期
                                const dateMatch = cells[0].match(/(\d{1,2})月(\d{1,2})日/);
                                if (dateMatch) {
                                    const day = parseInt(dateMatch[2]);
                                    const statusText = cells[2];
                                    
                                    let status = 'normal';
                                    if (statusText === '全天') status = 'full';
                                    else if (statusText === '半天') status = 'half';
                                    
                                    if (status !== 'normal') {
                                        data[day] = status;
                                    }
                                }
                            }
                        }
                        
                        // 表格结束
                        if (inTable && !line.startsWith('|') && line.trim() !== '') {
                            break;
                        }
                    }
                    
                    return {
                        month: monthKey,
                        data: data
                    };
                } catch (error) {
                    console.error('解析Markdown失败:', error);
                    return null;
                }
            }

            // 24. GitHub API - 获取文件
            async function getGithubFile() {
                const { token, repo, path } = githubConfig;
                const url = `https://api.github.com/repos/${repo}/contents/${path}`;
                
                const response = await fetch(url, {
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                
                if (response.status === 404) {
                    return null; // 文件不存在
                }
                
                if (!response.ok) {
                    throw new Error(`GitHub API错误: ${response.status}`);
                }
                
                const data = await response.json();
                // 解码base64内容
                const content = atob(data.content.replace(/\n/g, ''));
                return {
                    sha: data.sha,
                    content: JSON.parse(content)
                };
            }
            
            // 25. GitHub API - 创建或更新文件
            async function updateGithubFile(content, sha = null, message = 'Update overtime data') {
                const { token, repo, path } = githubConfig;
                const url = `https://api.github.com/repos/${repo}/contents/${path}`;
                
                const body = {
                    message: message,
                    content: btoa(JSON.stringify(content, null, 2))
                };
                
                if (sha) {
                    body.sha = sha;
                }
                
                const response = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || `GitHub API错误: ${response.status}`);
                }
                
                return await response.json();
            }
            
            // 26. 从GitHub拉取数据
            async function pullFromGitHub() {
                if (!githubConfig.token || !githubConfig.repo) {
                    alert('请先配置GitHub同步设置');
                    return;
                }
                
                syncPullBtn.disabled = true;
                syncPullBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 拉取中...';
                
                try {
                    const result = await getGithubFile();
                    
                    if (result && result.content) {
                        // 合并数据：GitHub数据 + 本地数据
                        // 本地数据优先（用户当前正在编辑）
                        for (const monthKey in result.content) {
                            if (!overtimeData[monthKey]) {
                                overtimeData[monthKey] = result.content[monthKey];
                            } else {
                                // 合并月份数据
                                for (const day in result.content[monthKey]) {
                                    if (!overtimeData[monthKey][day]) {
                                        overtimeData[monthKey][day] = result.content[monthKey][day];
                                    }
                                }
                            }
                        }
                        
                        localStorage.setItem('overtimeRecord', JSON.stringify(overtimeData));
                        renderCalendar();
                        showSyncSuccess('pull');
                    } else {
                        alert('GitHub上暂无数据，将使用本地数据');
                    }
                } catch (error) {
                    console.error('拉取数据失败:', error);
                    alert(`拉取失败: ${error.message}`);
                } finally {
                    syncPullBtn.disabled = false;
                    syncPullBtn.innerHTML = '<i class="fas fa-cloud-download-alt"></i> 从GitHub拉取';
                }
            }
            
            // 27. 推送数据到GitHub
            async function pushToGitHub() {
                if (!githubConfig.token || !githubConfig.repo) {
                    alert('请先配置GitHub同步设置');
                    return;
                }
                
                syncPushBtn.disabled = true;
                syncPushBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 推送中...';
                
                try {
                    // 先尝试获取现有文件的SHA
                    let sha = null;
                    try {
                        const existing = await getGithubFile();
                        if (existing) {
                            sha = existing.sha;
                        }
                    } catch (e) {
                        // 文件不存在，继续创建
                    }
                    
                    const message = sha ? 
                        `Update overtime data - ${new Date().toLocaleString('zh-CN')}` :
                        `Initial overtime data - ${new Date().toLocaleString('zh-CN')}`;
                    
                    await updateGithubFile(overtimeData, sha, message);
                    showSyncSuccess('push');
                } catch (error) {
                    console.error('推送数据失败:', error);
                    alert(`推送失败: ${error.message}`);
                } finally {
                    syncPushBtn.disabled = false;
                    syncPushBtn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> 推送到GitHub';
                }
            }
            
            // 28. 显示同步成功提示
            function showSyncSuccess(type) {
                const btn = type === 'pull' ? syncPullBtn : syncPushBtn;
                const originalHTML = btn.innerHTML;
                const originalBgColor = btn.style.backgroundColor;
                
                if (type === 'pull') {
                    btn.innerHTML = '<i class="fas fa-check"></i> 拉取成功';
                    btn.style.backgroundColor = '#00b894';
                } else {
                    btn.innerHTML = '<i class="fas fa-check"></i> 推送成功';
                    btn.style.backgroundColor = '#00b894';
                }
                
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    btn.style.backgroundColor = originalBgColor;
                }, 1500);
            }
        });
    </script>
</body>
</html>
